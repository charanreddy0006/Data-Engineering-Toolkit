apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-fleet-summary
  namespace: automobile-data
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: summary
              image: automobile-summary:1.0
