apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-etl-api
  namespace: vehicle-data
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vehicle-etl-api
  template:
    metadata:
      labels:
        app: vehicle-etl-api
    spec:
      containers:
        - name: api
          image: company/vehicle-etl-api:git-REPLACE_ME
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
