name: Docker Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build             -f examples/python-etl/Dockerfile             -t vehicle-etl:${{ github.sha }}             examples/python-etl
