services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: automotive
      POSTGRES_USER: data_engineer
      POSTGRES_PASSWORD: dev_password
    volumes:
      - automotive_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_engineer -d automotive"]
      interval: 5s
      timeout: 3s
      retries: 10

  etl:
    build:
      context: ..
      dockerfile: automobile-project/etl/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: automotive
      DB_USER: data_engineer
      DB_PASSWORD: dev_password
    depends_on:
      postgres:
        condition: service_healthy

  quality:
    build:
      context: ..
      dockerfile: automobile-project/quality/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: automotive
      DB_USER: data_engineer
      DB_PASSWORD: dev_password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  automotive_data:
