apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-api
  namespace: vehicle-data
spec:
  replicas: 3
  selector:
    matchLabels:
      app: telemetry-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: telemetry-api
        component: ingestion
    spec:
      serviceAccountName: telemetry-api
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: company/telemetry-api:1.0.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
