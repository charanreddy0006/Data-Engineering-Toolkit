apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-telemetry-etl
  namespace: vehicle-data
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: etl
              image: vehicle-telemetry-etl:1.0
              envFrom:
                - configMapRef:
                    name: telemetry-config
