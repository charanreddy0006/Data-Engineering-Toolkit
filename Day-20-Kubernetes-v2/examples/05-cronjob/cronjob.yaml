apiVersion: batch/v1
kind: CronJob
metadata:
  name: hourly-summary
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: summary
              image: busybox:1.36
              command:
                - sh
                - -c
                - echo "Generating telemetry summary"
