apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - echo ENV=$APP_ENV LEVEL=$LOG_LEVEL SIZE=$BATCH_SIZE; sleep 3600
      envFrom:
        - configMapRef:
            name: app-config
