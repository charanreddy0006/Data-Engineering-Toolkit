apiVersion: batch/v1
kind: Job
metadata:
  name: automobile-quality
  namespace: automobile-data
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: quality
          image: automobile-quality:1.0
          envFrom:
            - configMapRef:
                name: automobile-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
